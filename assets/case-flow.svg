<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Animated case lifecycle: a case moves from Awaiting Transport to Released, one click at a time (fictional data)">
<style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}.card{animation:mv 12s cubic-bezier(.6,0,.3,1) infinite}@keyframes mv{0%{transform:translate(0px,0)}18%{transform:translate(0px,0)}25%{transform:translate(222px,0)}43%{transform:translate(222px,0)}50%{transform:translate(444px,0)}68%{transform:translate(444px,0)}75%{transform:translate(666px,0)}93%{transform:translate(666px,0)}100%{transform:translate(666px,0)}}@keyframes s0{0%,18%{opacity:1}21%,97%{opacity:0}100%{opacity:1}}.s0{opacity:0;animation:s0 12s linear infinite}@keyframes s1{0%,22%{opacity:0}25%,43%{opacity:1}46%,100%{opacity:0}}.s1{opacity:0;animation:s1 12s linear infinite}@keyframes s2{0%,47%{opacity:0}50%,68%{opacity:1}71%,100%{opacity:0}}.s2{opacity:0;animation:s2 12s linear infinite}@keyframes s3{0%,72%{opacity:0}75%,93%{opacity:1}96%,100%{opacity:0}}.s3{opacity:0;animation:s3 12s linear infinite}.s0{opacity:1}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#BDBDBD"/></marker></defs>
<rect width="900" height="250" rx="16" fill="#F5F5F5"/>
<g class="f">
<text x="24" y="30" font-size="11" font-weight="700" letter-spacing="2" fill="#0f7b6c">ONE CASE, START TO FINISH</text>
<text x="876" y="30" text-anchor="end" font-size="12" fill="#8A8A8A">fictional data</text>
<rect x="24" y="44" width="196" height="150" rx="8" fill="#EBEBEB"/>
<circle cx="38" cy="62" r="4" fill="#0F6CBD"/><text x="48" y="66" font-size="13" font-weight="600" fill="#242424">Awaiting Transport</text>
<path d="M224 119 l14 0" stroke="#BDBDBD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="246" y="44" width="196" height="150" rx="8" fill="#EBEBEB"/>
<circle cx="260" cy="62" r="4" fill="#C4510E"/><text x="270" y="66" font-size="13" font-weight="600" fill="#242424">Awaiting Embalming</text>
<path d="M446 119 l14 0" stroke="#BDBDBD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="468" y="44" width="196" height="150" rx="8" fill="#EBEBEB"/>
<circle cx="482" cy="62" r="4" fill="#107C10"/><text x="492" y="66" font-size="13" font-weight="600" fill="#242424">Ready for Pickup</text>
<path d="M668 119 l14 0" stroke="#BDBDBD" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="690" y="44" width="196" height="150" rx="8" fill="#EBEBEB"/>
<circle cx="704" cy="62" r="4" fill="#9E9E9E"/><text x="714" y="66" font-size="13" font-weight="600" fill="#242424">Released</text>
<g class="card"><rect x="34" y="80" width="176" height="72" rx="6" fill="#fff" stroke="#E1E1E1"/>
<rect class="s0" x="34" y="80" width="4" height="72" rx="2" fill="#0F6CBD"/>
<rect class="s1" x="34" y="80" width="4" height="72" rx="2" fill="#C4510E"/>
<rect class="s2" x="34" y="80" width="4" height="72" rx="2" fill="#107C10"/>
<rect class="s3" x="34" y="80" width="4" height="72" rx="2" fill="#9E9E9E"/>
<text x="48" y="102" font-size="13" font-weight="600" fill="#242424">Daniel Ortega Ruiz</text>
<text x="48" y="120" font-size="11.5" fill="#616161">C-2026-00750 · #941</text>
<text x="48" y="141" font-size="11.5" fill="#616161">North Bay Medical</text>
<text class="s0" x="200" y="141" text-anchor="end" font-size="11.5" font-weight="600" fill="#8A8A8A">—</text>
<text class="s1" x="200" y="141" text-anchor="end" font-size="11.5" font-weight="600" fill="#242424">day 4</text>
<text class="s2" x="200" y="141" text-anchor="end" font-size="11.5" font-weight="600" fill="#C50F1F">day 10</text>
<text class="s3" x="200" y="141" text-anchor="end" font-size="11.5" font-weight="600" fill="#616161">out</text>
