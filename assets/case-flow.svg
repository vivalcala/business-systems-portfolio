<rect x="24" y="206" width="852" height="30" rx="15" fill="#fff" stroke="#E1E1E1"/>
<text x="44" y="226" font-size="12" font-weight="700" letter-spacing="1" fill="#0f7b6c">CLICK</text>
<text class="s0" x="98" y="226" font-size="13" fill="#242424">Case created from the scanned release form → Request transport → Send to driver</text>
<text class="s1" x="98" y="226" font-size="13" fill="#242424">Date received → status updates itself</text>
<text class="s2" x="98" y="226" font-size="13" fill="#242424">Mark embalmed</text>
<text class="s3" x="98" y="226" font-size="13" fill="#242424">Ask provider → Add to pickup → Send to driver</text>
</g></svg>