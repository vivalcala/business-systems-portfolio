<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="Open-source tool: PDF Form Splitter">
  <style>.f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
  <defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
  <rect width="900" height="170" rx="16" fill="url(#p)"/>
  <g class="f">
    <text x="28" y="38" font-size="11" font-weight="700" letter-spacing="2" fill="#ddd6fe">OPEN-SOURCE TOOL</text>
    <text x="28" y="70" font-size="24" font-weight="700" fill="#ffffff">PDF Form Splitter</text>
    <text x="28" y="98" font-size="15" fill="#ede9fe">Any messy scan → named documents + clean JSON.</text>
    <text x="28" y="120" font-size="15" fill="#ede9fe">New document type = new profile, no code changes.</text>
    <g font-size="12" font-weight="600" fill="#ffffff">
      <rect x="28" y="136" width="62" height="22" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="59" y="151" text-anchor="middle">Python</text>
      <rect x="98" y="136" width="48" height="22" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="122" y="151" text-anchor="middle">OCR</text>
      <rect x="154" y="136" width="96" height="22" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="202" y="151" text-anchor="middle">JSON profiles</text>
    </g>
  </g>
  <rect x="520" y="28" width="352" height="114" rx="10" fill="#0b1220" fill-opacity=".55"/>
  <g class="m" font-size="12">
    <text x="536" y="54" fill="#a5b4fc">$ python split_forms.py --profile invoice</text>
    <text x="536" y="78" fill="#86efac">page(s) 1-2 → Northwind_INV-1042.pdf</text>
    <text x="536" y="100" fill="#86efac">page(s) 3   → Blue_Harbor_BH-77.pdf</text>
    <text x="536" y="124" fill="#e9d5ff">Done: 2 documents saved, 0 need review</text>
  </g>
</svg>
